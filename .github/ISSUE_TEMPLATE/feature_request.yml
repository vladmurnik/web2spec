name: Feature request
description: Suggest a new provider, page type or workflow
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can the current pipeline not do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Keep the evidence contract and the 4 GB VRAM constraint in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: The proposal does not require a paid search API
          required: true
        - label: The proposal does not require two models resident on 4 GB VRAM
          required: true
