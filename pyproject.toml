[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "web2spec"
version = "0.1.0"
description = "QLoRA fine-tuning of Qwen2.5-0.5B for HTML → structured data extraction on 4 GB VRAM"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.4",
  "transformers>=4.46",
  "peft>=0.13",
  "bitsandbytes>=0.44",
  "accelerate>=1.0",
  "datasets>=3.0",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "jsonschema>=4.23",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
